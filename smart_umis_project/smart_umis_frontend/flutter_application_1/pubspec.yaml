name: flutter_application_1
description: Smart UMIS Data Entry System - A Flutter application for managing student and staff records with authentication and data entry capabilities.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core dependencies
  http: ^1.2.0
  intl: ^0.18.0
  path: ^1.8.3
  
  # Database
  sqflite: ^2.2.0
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^0.4.0+1
  
  # UI Components
  flutter_speed_dial: ^7.0.0
  cupertino_icons: ^1.0.2
  avatar_glow: ^3.0.1
  qr_flutter: ^4.1.0
  
  # File & Storage
  file_picker: ^8.0.0+1
  file_saver: ^0.2.7
  path_provider: ^2.1.3
  open_file: ^3.3.2
  
  # Image & Camera
  image_picker: ^1.1.2
  image_picker_web: ^3.1.1
  mobile_scanner: ^5.2.3
  qr_code_dart_scan: ^0.7.1  

  
  # QR Code
  qr_code_tools: ^0.2.0
  
  
  # Sharing & Permissions
  share_plus: ^7.2.1
  permission_handler: ^11.0.1
  
  # Speech
  speech_to_text: ^7.3.0
  flutter_tts: ^3.8.5
  
  # Web support (only for web builds)
  universal_html: ^2.2.4
  image_gallery_saver_plus: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true